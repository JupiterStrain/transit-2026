baseURL = "https://jupiterstrain.github.io/transit-2026/"
title = "THE TRANSIT - 2026"
theme = "transit"

defaultContentLanguage = "en"

[languages]
  [languages.en]
    languageCode = "en-us"
    weight = 1

[params]
  description = "Survey alerts, observatory circulars, compiled photometry and astrometric solutions relating to object CVIS-DR7-04471."
  root_label = "CVIS-DR7-04471"
  banner = "PUBLIC ALERT STREAM — AUTOMATED DISTRIBUTION — CONTENTS UNREVIEWED AND SUBJECT TO WITHDRAWAL"
  issuer = "CERRO VENTANA OBSERVATORY &middot; DATA MANAGEMENT"
  # The footer link is hidden while these are empty, so the site never
  # advertises a channel that is not there. Note this is the ONLY outward link
  # on the site besides the primary-source citation on the PLATE 41 record —
  # the two YouTube channels never link to each other directly.
  channel = "@TheTransit2026"
  channel_url = "https://www.youtube.com/@TheTransit2026"

# No taxonomies. This is a file server, not a blog — tag and category pages
# would be the one thing on the site that gives away that it is a blog.
[taxonomies]
